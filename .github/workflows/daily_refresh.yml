name: Daily BQ Refresh

# 受注案件のクラウド完結ルール準拠（CLAUDE.md）：
# 旧来 ローカルcron で動いていた scripts/daily_refresh.sh を完全クラウド化。
# 2026-05-04 の週次レポート不達インシデント（marts.daily_kpi_summary が4/14で停止）を契機に新設。

on:
  schedule:
    # 毎日 19:00 UTC = 翌日 JST AM 4:00（旧cron `0 4 * * *` 相当）
    #   この回は下流ジョブの前提。動かさないこと:
    #     health_check     JST 06:00「daily_refresh の2時間後」
    #     weekly_report    月曜 JST 09:00 ／ monthly_report 3日 JST 09:00
    #   これらは「朝9時までに当日分のmartが出来ている」前提で走る。
    - cron: '0 19 * * *'
    # 2026-07-20 追加: 毎日 03:00 UTC = JST 12:00
    #   GA4のdailyエクスポートがBQへ着地するのは「翌日 JST 08:31〜11:04」
    #   （直近30日を `__TABLES__.last_modified_time` で実測。最遅 6/22 11:04）。
    #   AM4:00の回は 30日中30日とも着地前に走っており、最新日が必ず1日遅れて
    #   martへ入っていた（ジョブは毎回 success ＝「成功≠成果物最新」）。
    #   最遅着地の56分後にあたる JST 12:00 に2回目を足し、当日中に最新日を取り込む。
    #   移動でなく追加にした理由: 移動すると上記3ジョブが更新前に走る（Looker鮮度を直す
    #   代わりに客様へ届く週次・月次レポートが1日古くなる）。
    #   marts は CREATE OR REPLACE の全再構築＝冪等なので、2回走っても二重計上しない。
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write     # notify-failure 用

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud / bq
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.ARK_GCP_PROJECT_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps (for alert.py / check_data_freshness.py)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily refresh
        env:
          ARK_GCP_PROJECT_ID: ${{ secrets.ARK_GCP_PROJECT_ID }}
          ARK_GA4_PROPERTY_ID: ${{ secrets.ARK_GA4_PROPERTY_ID }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.ARK_GCP_PROJECT_ID }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}
        run: |
          chmod +x ./scripts/daily_refresh.sh
          ./scripts/daily_refresh.sh

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log
          path: logs/refresh_*.log
          retention-days: 14

      # ---------- 失敗時の冗長化通知（Lark + Issue + Mail） ----------
      - name: Notify failure (3 channels)
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          lark_webhook:     ${{ secrets.LARK_BOT_WEBHOOK }}
          smtp_user:        ${{ secrets.SMTP_USER }}
          smtp_pass:        ${{ secrets.SMTP_PASS }}
          alert_recipients: ${{ secrets.ALERT_RECIPIENTS }}
          github_token:     ${{ secrets.GITHUB_TOKEN }}
          failed_step:      "daily_refresh"
          severity:         "critical"
